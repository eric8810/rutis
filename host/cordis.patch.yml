# rutis-bridge bundle patch: insert the bridge plugin over the profile's
# composed tree. The bridge is a settings-driven multi-route aggregate
# adapter (llm-pi-ai's role): routes live in the `llm-aimux:` settings
# section's providers dict, configured and selected on the web Models page —
# no default-model override here, the page owns the selection.
- insert:
    - id: rutis-bridge
      name: 'rutis-bridge'
      config:
        forwardEvents:
          - agent/turn-end
