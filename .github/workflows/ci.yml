# 常规 CI:push / PR 自动跑全量测试 + 编译检查。
# 防回归:任何改动(agent/cli/内核/桥)引入的失败在此显式变红。
#
# 依赖说明:rutis-agent 以 path 依赖引用仓库外兄弟 checkout rutui
# (`crates/rutis-agent/../../../rutui`,解析为 $GITHUB_WORKSPACE/../rutui)。
# actions/checkout 的 path 不允许逃逸 workspace 外,故先 checkout 到
# workspace 内 `.rutui-checkout`,再 symlink 到预期位置。rutui-* 尚未发布
# crates.io,发布前维持此安排(见 docs/design-rutui-rewrite-2026-08-23.md)。
#
# node e2e(rutis-cordis host_cordis)需要外部 checkout(DSH_ROOT /
# MIN_CORDIS_ROOT),CI 环境没有,经 RUTIS_SKIP_NODE_E2E=1 跳过。

name: ci

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # rutis-agent path 依赖的外部 rutui checkout
      - name: checkout rutui (path dependency)
        uses: actions/checkout@v4
        with:
          repository: eric8810/rutui
          path: .rutui-checkout

      # symlink 到 path 依赖解析位置(crates/rutis-agent/../../../rutui)
      - name: symlink rutui to expected path
        run: |
          ln -s "$GITHUB_WORKSPACE/.rutui-checkout" "$GITHUB_WORKSPACE/../rutui"
          ls -la "$GITHUB_WORKSPACE/../rutui" | head -3

      - name: install rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo test (workspace, skip node e2e)
        run: cargo test --workspace
        env:
          RUTIS_SKIP_NODE_E2E: "1"

      - name: cargo check (all targets)
        run: cargo check --workspace --all-targets
