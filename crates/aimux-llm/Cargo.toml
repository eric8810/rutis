[package]
name = "aimux-llm"
description = "llm service as an independent rutis plugin (aimux backend, host-agnostic)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rutis = { path = "../rutis" }
aimux-core = "0.3.0"
aimux-providers = "0.3.0"
async-stream = "0.3.6"
async-trait = "0.1.92"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true }
