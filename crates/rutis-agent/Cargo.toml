[package]
name = "rutis-agent"
description = "Minimal agent framework on rutis five pillars: aimux LanguageModel service, ToolRegistry + AgentDriver plugins, in-memory session, streaming turns"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
rutis = { path = "../rutis" }
aimux-core = { path = "../../../aimux/aimux-core" }
tokio = { workspace = true, features = ["process"] }
tokio-util = { workspace = true }
thiserror = { workspace = true }
serde_json = "1"
futures = "0.3.34"
async-stream = "0.3.6"
async-trait = "0.1.92"
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
unicode-width = "0.2.2"

[dev-dependencies]
aimux-providers = { path = "../../../aimux/aimux-providers" }
