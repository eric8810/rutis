[package]
name = "rutis-dsh"
description = "dsh bridge face (Rust side): dsh node validation, llm seam, event mapping, runner binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rutis = { path = "../rutis" }
rutis-cordis = { path = "../rutis-cordis" }
aimux-core = "0.3.0"
aimux-providers = "0.3.0"
futures = "0.3"
async-stream = "0.3.6"
async-trait = "0.1.92"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true }

[[bin]]
name = "rutis-dsh"
path = "src/bin/rutis_dsh.rs"
