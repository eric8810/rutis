[package]
name = "rutis-dsh"
description = "entry point + composition root: rutis runtime, aimux-llm plugin, business-agnostic bridge to the dsh host process"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
aimux-llm = { path = "../aimux-llm" }
rutis = { path = "../rutis" }
rutis-cordis = { path = "../rutis-cordis" }
aimux-core = "0.3.0"
async-trait = "0.1.92"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true }

[dev-dependencies]
async-stream = "0.3.6"

[[bin]]
name = "rutis-dsh"
path = "src/bin/rutis_dsh.rs"
