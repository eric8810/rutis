[package]
name = "rutis-hotplug-demo"
description = "cdylib hot-plug demo: a rutis Plugin compiled as a dynamic library, loaded at runtime"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
rutis = { path = "../rutis" }
rutis-agent = { path = "../rutis-agent" }
serde_json = "1"
libloading = "0.8"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
